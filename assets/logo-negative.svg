<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Playball&amp;display=swap');
      .seralico-brand-text-white {
        font-family: 'Playball', 'Brush Script MT', 'Dancing Script', 'Segoe UI', cursive, sans-serif;
        font-size: 64px;
        fill: #FFFFFF;
        font-weight: 400;
        letter-spacing: 0.5px;
      }
      .seralico-sub-text-white {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 15px;
        font-weight: 400;
        fill: #E2E8F0;
        letter-spacing: -0.2px;
        word-spacing: 1px;
      }
    </style>
  </defs>
  
  <g id="logo-negative-content">
    <text x="50%" y="60" text-anchor="middle" class="seralico-brand-text-white">Seralico</text>
    <text x="50%" y="88" text-anchor="middle" class="seralico-sub-text-white">servicio argentino de limpieza y comida</text>
  </g>
</svg>
